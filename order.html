<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>下单确认 · 书易</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a class="back" id="backBtn" href="javascript:history.back()">‹</a>
  <span class="title">下单确认</span>
</div>

<div id="app"></div>

<div class="bottom-fixed">
  <button class="btn" onclick="submitOrder()">提交订单</button>
</div>

<script src="js/data.js"></script>
<script>
let cur = null;
let booking = { loc: "", when: "", note: "" };

function shade(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, (n >> 16) - 45), g = Math.max(0, ((n >> 8) & 255) - 45), b = Math.max(0, (n & 255) - 45);
  return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
}

function render() {
  const id = new URLSearchParams(location.search).get("id");
  cur = bookById(id);
  if (!cur) {
    document.getElementById("app").innerHTML = `<div class="empty"><span class="big">😕</span>书籍不存在</div>`;
    return;
  }
  document.getElementById("app").innerHTML = `
    <div class="section-block" style="display:flex;gap:12px;align-items:center">
      <div class="thumb" style="width:58px;height:76px;border-radius:10px;background:linear-gradient(160deg,${cur.color},${shade(cur.color)});display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff">${cur.emoji}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:800;font-size:16px">${esc(cur.title)}</div>
        <div style="font-size:12px;color:var(--text-2);margin-top:2px">${esc(cur.author)} · ${esc(cur.cond)}</div>
        <div style="font-size:15px;color:var(--danger);font-weight:800;margin-top:4px">¥${cur.price}</div>
      </div>
    </div>
    <div class="form">
      <div class="field">
        <label>面交地点</label>
        <div class="radio-grid" id="locGrid">
          ${MEET_LOCS.map(l => `<label><input type="radio" name="loc" value="${l}" ${booking.loc === l ? "checked" : ""} onclick="pickLoc('${l}')"><span>${l}</span><small>校内</small></label>`).join("")}
        </div>
      </div>
      <div class="field">
        <label>交易时间</label>
        <div class="radio-grid" id="whenGrid">
          ${["今天 17:30", "今天 19:00", "明天中午", "明天 17:30"].map(w => `<label><input type="radio" name="when" value="${w}" ${booking.when === w ? "checked" : ""} onclick="pickWhen('${w}')"><span>${w}</span><small>面交</small></label>`).join("")}
        </div>
      </div>
      <div class="field">
        <label>给卖家的留言(选填)</label>
        <textarea id="note" placeholder="比如:帮忙带一下《数学分析》的笔记?">${esc(booking.note)}</textarea>
      </div>
    </div>
  `;
}

function pickLoc(v) { booking.loc = v; }
function pickWhen(v) { booking.when = v; }

function submitOrder() {
  if (!booking.loc) { toast("请选择面交地点"); return; }
  if (!booking.when) { toast("请选择交易时间"); return; }
  const note = document.getElementById("note").value;
  const o = {
    id: uid(),
    bookId: cur.id,
    title: cur.title,
    emoji: cur.emoji,
    color: cur.color,
    price: cur.price,
    loc: booking.loc,
    when: booking.when,
    note: note,
    status: "pending",
    time: new Date().toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }),
    seller: cur.seller
  };
  const list = orders();
  list.unshift(o);
  saveOrders(list);
  toast("预约成功!");
  setTimeout(() => go("orders.html"), 600);
}
render();
</script>
</body>
</html>
