<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>订单详情 · 书易</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a class="back" href="orders.html">‹</a>
  <span class="title">订单详情</span>
</div>

<div id="app"></div>

<div class="btn-row" id="actions"></div>

<script src="js/data.js"></script>
<script>
function render() {
  const id = new URLSearchParams(location.search).get("id");
  const o = orders().find(x => x.id === id);
  const box = document.getElementById("app");
  const act = document.getElementById("actions");
  if (!o) {
    box.innerHTML = `<div class="empty"><span class="big">📦</span>订单不存在</div>`;
    act.innerHTML = "";
    return;
  }
  const stMap = { pending: ["待交易", "pending"], done: ["已完成", "done"], cancel: ["已取消", "cancel"] };
  const [txt, cls] = stMap[o.status] || stMap.pending;
  box.innerHTML = `
    <div class="section-block">
      <h3>📦 订单状态</h3>
      <span class="badge ${cls}" style="font-size:13px;padding:4px 12px">${txt}</span>
      <div style="margin-top:8px;font-size:12px;color:var(--text-2)">下单时间:${esc(o.time)} · 订单号:${o.id.slice(-6).toUpperCase()}</div>
    </div>
    <div class="section-block" style="display:flex;gap:12px;align-items:center">
      <div class="thumb" style="width:56px;height:72px;border-radius:10px;background:linear-gradient(160deg,${o.color},#6b7280);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff">${o.emoji}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:800">${esc(o.title)}</div>
        <div style="font-size:12px;color:var(--text-2);margin-top:2px">卖家:${esc(o.seller)}</div>
        <div style="font-size:16px;color:var(--danger);font-weight:800;margin-top:4px">¥${o.price}</div>
      </div>
    </div>
    <div class="section-block">
      <h3>🤝 面交信息</h3>
      <div class="kv"><span>地点</span><b>${esc(o.loc)}</b></div>
      <div class="kv"><span>时间</span><b>${esc(o.when)}</b></div>
      ${o.note ? `<div class="kv"><span>留言</span><b>${esc(o.note)}</b></div>` : ""}
    </div>
  `;
  if (o.status === "pending") {
    act.innerHTML = `
      <button class="btn outline" onclick="setStatus('${o.id}','cancel')">取消订单</button>
      <button class="btn" onclick="setStatus('${o.id}','done')">确认完成</button>`;
  } else {
    act.innerHTML = `<button class="btn ghost" onclick="go('orders.html')">返回订单列表</button>`;
  }
}
function setStatus(id, st) {
  const list = orders();
  const o = list.find(x => x.id === id);
  if (!o) return;
  o.status = st;
  saveOrders(list);
  toast(st === "done" ? "交易完成 🎉" : "订单已取消");
  setTimeout(render, 500);
}
render();
</script>
</body>
</html>
