<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>我的订单 · 书易</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a class="back" href="mine.html">‹</a>
  <span class="title">我的订单</span>
</div>

<div class="chips" style="padding-top:10px">
  <button class="chip active" id="tab-all" onclick="setTab('all')">全部</button>
  <button class="chip" id="tab-pending" onclick="setTab('pending')">待交易</button>
  <button class="chip" id="tab-done" onclick="setTab('done')">已完成</button>
</div>

<div id="list"></div>

<script src="js/data.js"></script>
<script>
let tab = "all";
function setTab(t) {
  tab = t;
  ["all", "pending", "done"].forEach(x => document.getElementById("tab-" + x).classList.toggle("active", x === t));
  render();
}
const stMap = { pending: ["待交易", "pending"], done: ["已完成", "done"], cancel: ["已取消", "cancel"] };
function render() {
  const list = orders().filter(o => tab === "all" || o.status === tab);
  const box = document.getElementById("list");
  if (!list.length) {
    box.innerHTML = `<div class="empty"><span class="big">📦</span>${tab === "all" ? "还没有订单" : "这个状态还没有订单"}<br>去首页挑一本喜欢的书吧</div>`;
    return;
  }
  box.innerHTML = list.map(o => {
    const [txt, cls] = stMap[o.status] || stMap.pending;
    return `<a class="list-card" href="order-detail.html?id=${o.id}">
      <div class="thumb" style="background:linear-gradient(160deg,${o.color},#6b7280)">${o.emoji}</div>
      <div class="body">
        <div class="t">${esc(o.title)}</div>
        <div class="s">${esc(o.loc)} · ${esc(o.when)}</div>
        <div class="p" style="display:flex;justify-content:space-between;align-items:center">
          <span style="color:var(--danger)">¥${o.price}</span>
          <span class="badge ${cls}">${txt}</span>
        </div>
      </div>
    </a>`;
  }).join("");
}
render();
</script>
</body>
</html>
